<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Day Seven" />
    <title>Day Seven - Win the Week</title>
    <meta name="description" content="Track your fitness streaks. Consistency beats intensity." />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts - Caveat for hand-drawn style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body { background: #000; }
      #initial-loader { position: fixed; inset: 0; z-index: 2147483647; background: #000; display: flex; align-items: center; justify-content: center; }
      /* The D7 logo drawing itself: the D, then the 7, a beat with the full mark, a fade,
         and again. Shared with the in-app loader (src/components/LaunchLoader.jsx). */
      .d7-loader { width: 88px; height: 88px; overflow: visible; }
      .d7-loader path { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; }
      .d7-loader-d { stroke-width: 65; animation: d7-loader-d 2.4s cubic-bezier(.7,0,.3,1) infinite; }
      .d7-loader-7 { stroke-width: 50; stroke-dasharray: 100; animation: d7-loader-7 2.4s cubic-bezier(.7,0,.3,1) infinite; }
      @keyframes d7-loader-d {
        0%   { stroke-dasharray: 0 100; opacity: 1; }
        40%  { stroke-dasharray: 100 0; opacity: 1; }
        82%  { stroke-dasharray: 100 0; opacity: 1; }
        100% { stroke-dasharray: 100 0; opacity: 0; }
      }
      @keyframes d7-loader-7 {
        0%, 35% { stroke-dashoffset: 100; opacity: 1; }
        62%     { stroke-dashoffset: 0;   opacity: 1; }
        82%     { stroke-dashoffset: 0;   opacity: 1; }
        100%    { stroke-dashoffset: 0;   opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .d7-loader path { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- Launch loader: paints before any JS runs, above the app. The app keeps it up while
         a screen is loading and fades it out after (src/components/LaunchLoader.jsx). -->
    <div id="initial-loader" aria-hidden="true">
      <svg class="d7-loader" viewBox="0 0 1024 1024">
        <path class="d7-loader-d" d="M250 160 L250 864 L500 864 C740 864 820 680 820 512 C820 344 740 160 500 160 L250 160" pathLength="100"/>
        <path class="d7-loader-7" d="M400 330 L600 330 L460 694" pathLength="100"/>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
