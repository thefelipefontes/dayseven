<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Day Seven" />
    <title>Day Seven - Win the Week</title>
    <meta name="description" content="Track your fitness streaks. Consistency beats intensity." />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts - Caveat for hand-drawn style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body { background: #000; }
      #initial-loader { position: fixed; inset: 0; z-index: 2147483647; background: #000; display: flex; align-items: center; justify-content: center; }
      /* The D7 logo drawing itself: the D, then the 7, a beat with the full mark, a fade,
         and again. Shapes traced from the app icon (public/icon.png); the viewBox is shifted
         to centre the mark, which the icon sits a little right of centre. Shared with the
         in-app loader (src/components/LaunchLoader.jsx). */
      .d7-loader { width: 220px; height: 220px; overflow: visible; animation: d7-loader-fade 2.4s infinite; }
      .d7-loader-d { fill: none; stroke: #fff; stroke-width: 60; stroke-linecap: round; stroke-linejoin: round; animation: d7-loader-d 2.4s cubic-bezier(.7,0,.3,1) infinite; }
      .d7-loader-bar { fill: none; stroke: #333; stroke-width: 60; animation: d7-loader-bar 2.4s ease-out infinite; }
      .d7-loader-7 { fill: #fff; }
      /* The 7 is solid, so a thick stroke through its middle, drawn like a line, reveals it. */
      .d7-loader-7-trace { fill: none; stroke: #fff; stroke-width: 72; stroke-linecap: square; stroke-linejoin: miter; stroke-dasharray: 100; animation: d7-loader-7 2.4s cubic-bezier(.7,0,.3,1) infinite; }
      @keyframes d7-loader-fade { 0%, 82% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes d7-loader-d { 0% { stroke-dasharray: 0 100; } 40%, 100% { stroke-dasharray: 100 0; } }
      @keyframes d7-loader-bar { 0% { opacity: 0; } 30%, 100% { opacity: 1; } }
      @keyframes d7-loader-7 { 0%, 35% { stroke-dashoffset: 100; } 62%, 100% { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .d7-loader, .d7-loader-d, .d7-loader-bar, .d7-loader-7-trace { animation: none; }
        .d7-loader-d { stroke-dasharray: none; }
        .d7-loader-7-trace { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <!-- Launch loader: paints before any JS runs, above the app. The app keeps it up while
         a screen is loading and fades it out after (src/components/LaunchLoader.jsx). -->
    <div id="initial-loader" aria-hidden="true">
      <svg class="d7-loader" viewBox="45.25 0 1024 1024">
        <defs><mask id="d7-loader-7-mask-boot" maskUnits="userSpaceOnUse"><path class="d7-loader-7-trace" d="M452.3 416.75 L570.65 416.75 L494.85 582.5" pathLength="100"/></mask></defs>
        <path class="d7-loader-bar" d="M352 312.1 L352 711.9"/>
        <path class="d7-loader-d" d="M352 312.1 L352 305.2 A43.2 43.2 0 0 1 395.2 262 L561.1 262 C693.7 262 762.5 353 762.5 511.5 C762.5 670 693.7 762 561.1 762 L395.2 762 A43.2 43.2 0 0 1 352 718.8 L352 711.9" pathLength="100"/>
        <path class="d7-loader-7" d="M452.3 399.7 L588.6 399.7 L588.6 427.4 L517.85 582.5 L471.85 582.5 L539.85 433.8 L452.3 433.8 Z" mask="url(#d7-loader-7-mask-boot)"/>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
